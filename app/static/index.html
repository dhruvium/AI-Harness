<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Harness</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <h1>Harness</h1>
      <div class="side-actions">
        <button id="newChatBtn" class="btn primary small">＋ New chat</button>
        <button id="archivedBtn" class="btn ghost small">Archived</button>
      </div>
    </div>
    <div id="sessionList"></div>
    <div class="side-foot">
      <button id="settingsBtn" class="btn ghost full">⚙ Settings</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <select id="providerSelect" title="Provider / model"></select>
      <div id="effortWrap">
        <label for="effortSelect">Effort</label>
        <select id="effortSelect">
          <option value="none">none</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
      </div>
      <button id="sysToggle" class="btn ghost small" title="System prompt">System</button>
      <div id="ctxMeter" title="">
        <div id="ctxBar"></div>
        <span id="ctxLabel"></span>
      </div>
    </header>

    <div id="systemPromptWrap" class="hidden">
      <textarea id="systemPrompt" placeholder="System prompt (sent with every request)…"></textarea>
    </div>

    <div id="messages"></div>

    <div id="projectChipRow" class="hidden">
      <button id="projectChip" class="chip-btn">
        <span class="folder">📁</span>
        <span id="projectChipName"></span>
        <span class="caret">▾</span>
      </button>
      <div id="projectMenu" class="ctx-menu hidden"></div>
    </div>

    <div id="attachTray" class="hidden"></div>

    <div id="composer">
      <button id="attachBtn" class="btn ghost" title="Attach files">＋</button>
      <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button id="sendBtn" class="btn primary">Send</button>
    </div>
    <input type="file" id="fileInput" multiple hidden>
  </main>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Settings</h2>
      <button id="closeSettingsBtn" class="btn ghost small">✕</button>
    </div>
    <div class="modal-tabs">
      <button id="tabGeneralBtn" class="tab-btn active">General</button>
      <button id="tabProvidersBtn" class="tab-btn">Providers</button>
    </div>
    <div class="modal-body">
      <section id="generalTab">
        <label class="switch-row">
          <div class="switch-text">
            <div class="switch-title">Memory</div>
            <div class="switch-desc">Save and reuse long-term context in workspaces. Applies to new sessions and may increase model requests and token costs.</div>
          </div>
          <input type="checkbox" id="memoryToggle" class="switch">
        </label>
        <details id="memoryManage" class="sub-block hidden">
          <summary>Stored memories (<span id="memoryCount">0</span>)</summary>
          <div id="memoryList"></div>
          <button id="clearMemoriesBtn" class="btn ghost small danger">Clear all memories</button>
        </details>
        <hr>
        <h3>Browser control</h3>
        <label class="switch-row">
          <div class="switch-text">
            <div class="switch-title">Enable browser use for tasks</div>
            <div class="switch-desc">Allow the assistant to use the built-in browser when carrying out your requests.</div>
          </div>
          <input type="checkbox" id="browserToggle" class="switch">
        </label>
        <label class="switch-row sub-row">
          <div class="switch-text">
            <div class="switch-title">Ignore certificate errors <span id="certRestartNote" class="restart-note hidden">Restart required to take effect</span></div>
            <div class="switch-desc">When enabled, the built-in browser stops verifying HTTPS certificates. Insecure — use only for testing.</div>
          </div>
          <input type="checkbox" id="certToggle" class="switch">
        </label>
        <div class="btn-row">
          <button id="clearCacheBtn" class="btn ghost small">Clear built-in browser cache</button>
          <button id="clearBrowserDataBtn" class="btn ghost small danger">Clear all browser data</button>
        </div>
        <hr>
        <h3>Power</h3>
        <label class="switch-row">
          <div class="switch-text">
            <div class="switch-title">Prevent sleep</div>
            <div class="switch-desc">Keeps the computer awake while the harness is running, so long tasks are not postponed by system sleep during inactivity.</div>
          </div>
          <input type="checkbox" id="sleepToggle" class="switch">
        </label>
      </section>

      <section id="providersTab" class="hidden">
        <div id="providerList"></div>
        <hr>
        <h3 id="formTitle">Add provider</h3>
        <form id="providerForm">
          <div class="grid2">
            <label>Name<input name="name" required placeholder="My OpenAI"></label>
            <label>Model<input name="model" required placeholder="gpt-5"></label>
            <label class="wide">Base URL<input name="baseUrl" required placeholder="https://api.openai.com/v1"></label>
            <label class="wide">API key <span class="hint">(blank = keep existing)</span><input name="apiKey" type="password" placeholder="sk-…"></label>
            <label>Format
              <select name="format">
                <option value="openai">OpenAI-compatible</option>
                <option value="anthropic">Anthropic Messages</option>
              </select>
            </label>
            <label>Context window (tokens)<input name="contextWindow" type="number" min="1000" value="128000"></label>
            <label class="wide">Max output tokens <span class="hint">(optional)</span><input name="maxTokens" type="number" min="1" placeholder="auto"></label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn primary" id="saveProviderBtn">Save provider</button>
          </div>
        </form>
      </section>
    </div>
  </div>
</div>

<div id="archivedModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Archived chats</h2>
      <button id="closeArchivedBtn" class="btn ghost small">✕</button>
    </div>
    <div class="modal-body" id="archivedList"></div>
  </div>
</div>

<div id="nameProjectModal" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-head">
      <h2>Name this project</h2>
      <button id="npmCloseBtn" class="btn ghost small">✕</button>
    </div>
    <div class="modal-body">
      <div class="npm-label">Folder</div>
      <div class="npm-path" id="npmPath"></div>
      <div class="npm-label">Project name</div>
      <input id="npmInput" placeholder="e.g. Quant Neeti 1" maxlength="60">
      <div class="form-actions">
        <button id="npmCancelBtn" class="btn ghost">Cancel</button>
        <button id="npmSaveBtn" class="btn primary">Create project</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
